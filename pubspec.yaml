name: madgi_mobile
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6
  animated_splash_screen: ^1.3.0
  mobile_scanner: ^7.1.3
  http: ^1.2.1
  shared_preferences: ^2.2.3
  easy_image_viewer: ^1.5.0
  intl: ^0.17.0
  date_format: ^2.0.7
  device_info_plus: ^10.1.0
  qr_flutter: ^4.1.0
  image_picker: ^1.1.2
  badges: ^3.1.2
  path: ^1.9.0
  flutter_pdfview: ^1.3.2
  path_provider: ^2.1.3
  dio: ^5.5.0+1
  permission_handler: ^11.3.1
  screen_protector: ^1.4.2+1
  confetti: ^0.7.0
  url_launcher: ^6.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_launcher_icons: "^0.13.1"
  flutter_lints: ^3.0.0

# CONFIGURATION DES ICONES - NE PAS METTRE "flutter_icons:"
flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/logo.jpg"

flutter:
  uses-material-design: true

  assets:
    - assets/
